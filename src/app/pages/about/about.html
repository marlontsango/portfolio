<section id="services" class="mx-auto max-w-6xl px-6 py-20">
  <h2 class="font-hand text-4xl">Ce que je fais</h2>
  <p class="text-neutral-600 dark:text-neutral-400 mt-2">
    Guidé par la passion du code et du design, je mets mes compétences au service de vos projets :
  </p>

  <div class="mt-10 grid gap-6 md:grid-cols-3">
    <article *ngFor="let s of services" class="rounded-xl bg-surface p-6 shadow-lg shadow-ink/5">
      <h3 class="text-lg font-semibold text-brand">{{ s.title }}</h3>
      <p class="mt-3 text-sm leading-relaxed">{{ s.text }}</p>
    </article>
  </div>
</section>

<section id="contact" class="mx-auto max-w-6xl px-6 pb-12 pt-20">
  <h2 class="font-hand text-4xl">Contact</h2>
  <p class="text-neutral-600 dark:text-neutral-400 mt-2">
    Un projet, une opportunité ou une simple question ?
  </p>
  <div class="rounded-2xl mt-10 bg-brand px-8 py-14 text-center text-white">
    <h2 class="font-hand text-4xl">Un projet en tête ?</h2>
    <p class="mx-auto mt-4 max-w-md text-sm leading-relaxed text-white/80">
      Décris-moi ton besoin, je te réponds rapidement.
    </p>
    <a
      [href]="'mailto:' + email"
      class="mt-8 inline-block rounded-md bg-sun px-6 py-3 text-sm font-semibold text-ink transition-colors hover:bg-white"
    >
      Écris-moi
    </a>
  </div>
</section>

<section
  id="home"
  class="mx-auto grid max-w-6xl gap-10 px-6 pb-16 pt-8 lg:min-h-[680px] lg:grid-cols-[1fr_auto_1fr] lg:pt-12"
>
  <!-- Colonne gauche -->
  <div class="flex flex-col justify-between gap-10 lg:order-1">
    <h1>
      <span class="block font-hand text-4xl text-ink sm:text-5xl">Salut, je suis</span>
      <span class="mt-3 block text-4xl font-semibold text-sun sm:text-5xl"
        >{{ firstName }} <span class="font-semibold text-brand">{{ lastName }}</span
        >.</span
      >
    </h1>

    <svg class="hidden h-40 w-72 lg:block" viewBox="0 0 300 160" fill="none" aria-hidden="true">
      <path
        d="M292 18C250-8 190 6 130 56S22 140 20 66"
        stroke="#26716B"
        stroke-width="2"
        stroke-dasharray="8 8"
        stroke-linecap="round"
      />
      <path
        d="M12 76l8-14 8 14"
        stroke="#26716B"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>

    <div class="space-y-8">
      <div class="flex items-center gap-3">
        <span class="text-4xl font-semibold text-brand">{{
          years < 10 ? '0' + years : years
        }}</span>
        <span class="text-sm font-medium leading-snug">Années<br />d'expérience</span>
      </div>
      <ul class="flex gap-6">
        <li *ngFor="let s of socials">
          <a
            [href]="s.href"
            target="_blank"
            rel="noopener"
            [attr.aria-label]="s.label"
            class="text-sun transition-colors hover:text-brand"
          >
            <svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor">
              <path [attr.d]="s.path" />
            </svg>
          </a>
        </li>
      </ul>
    </div>
  </div>

  <!-- Photo -->
  <div class="order-first flex items-end justify-center lg:order-2">
    <div
      class="aspect-square w-72 overflow-hidden rounded-full border-[6px] border-sun/70 bg-surface sm:w-96 lg:w-[26rem]"
    >
      <img
        src="assets/screenshots/profile.jpg"
        alt="Portrait de {{ firstName }}"
        class="h-full w-full object-cover object-top"
      />
    </div>
  </div>

  <!-- Colonne droite -->
  <div
    class="flex flex-col items-start justify-between gap-10 lg:order-3 lg:items-end lg:text-right"
  >
    <p class="max-w-xs text-sm leading-relaxed">
      Je conçois des applications web et mobiles simples à utiliser, et j'aime ce que je fais.
    </p>

    <div class="rounded-xl bg-surface p-4 shadow-xl shadow-ink/10">
      <p class="mb-3 text-sm font-medium">Technologies maîtrisées</p>
      <ul class="flex flex-wrap gap-2">
        <li
          *ngFor="let t of stack"
          class="rounded-full bg-brand/10 px-3 py-1 text-xs font-semibold text-brand"
        >
          {{ t }}
        </li>
      </ul>
    </div>

    <p>
      <span class="block font-script text-4xl text-ink sm:text-5xl">Développeur</span>
      <span class="block text-2xl font-semibold text-brand sm:text-3xl"
        >Frontend &amp; Mobile.</span
      >
    </p>
  </div>
</section>
<app-about></app-about>
<app-projects></app-projects>
<app-contact></app-contact>
